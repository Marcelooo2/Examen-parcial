<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #ffffff, #ffffff);
               display: flex; justify-content: center; align-items: center;
               min-height: 100vh; font-family: Arial, sans-serif; }
        .card { background: rgb(100, 81, 81); padding: 40px; border-radius: 12px;
                width: 360px; box-shadow: 0 10px 30px rgba(255, 255, 255, 0.4); }
        h2 { text-align: center; color: #fbfbfb; margin-bottom: 25px; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #ddd;
                border-radius: 6px; margin-bottom: 18px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #793030;
                 color: rgb(145, 70, 70); border: none; border-radius: 6px;
                 font-size: 16px; cursor: pointer; }
        button:hover { background: #ffffff; }
        .error { color: rgb(255, 255, 255); text-align: center; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Iniciar Sesión</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        <label>Usuario</label>
        <input type="text" name="username" placeholder="Ingrese usuario" required>
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="Ingrese contraseña" required>
        <button type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
